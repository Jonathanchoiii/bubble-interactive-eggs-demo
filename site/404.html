<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const forcedMode = params.get("native");
        const useNativePreview =
          forcedMode === "1" ||
          (forcedMode !== "0" &&
            window.matchMedia("(pointer: coarse)").matches &&
            window.innerWidth <= 600);
        document.documentElement.dataset.nativePreview = useNativePreview
          ? "true"
          : "false";
      })();
    </script>
    <title>Bubble 互动彩蛋原型</title>
    <script type="module" crossorigin src="/bubble-interactive-eggs-demo/assets/index-DnFrGIzQ.js"></script>
    <link rel="stylesheet" crossorigin href="/bubble-interactive-eggs-demo/assets/index-CFyLEsST.css">
    <style>
      .birthday-switch-to-swipe {
        display: none;
      }

      .cheer-stick-left {
        left: 20px;
        --cheer-victory-tilt: -5deg;
        --cheer-victory-counter-tilt: 3deg;
      }

      .cheer-stick-right {
        right: 20px;
        --cheer-victory-tilt: 5deg;
        --cheer-victory-counter-tilt: -3deg;
      }

      .cheer-arena-active {
        clip-path: inset(0 0 20% 0);
      }

      .cheer-arena-crowd-sway {
        clip-path: inset(45% 0 20% 0);
      }

      .cheer-stick-button::after {
        inset: -18px;
      }

      .cheer-overlay-complete .cheer-stick-button {
        transform-origin: 50% 64%;
        animation:
          cheer-victory-burst 0.92s cubic-bezier(0.2, 0.82, 0.24, 1) both,
          cheer-victory-shimmer 1.55s ease-in-out 0.92s infinite;
      }

      @keyframes cheer-victory-burst {
        0% {
          filter: brightness(1.12) drop-shadow(0 0 10px #41e0ffc2);
          transform: rotate(0) scale(1);
        }

        14% {
          filter: brightness(1.95) drop-shadow(0 0 30px #62efffff);
          transform: translateY(-3px) rotate(var(--cheer-victory-tilt))
            scale(1.06);
        }

        30% {
          filter: brightness(1.2) drop-shadow(0 0 14px #29b9ffcc);
          transform: rotate(var(--cheer-victory-counter-tilt)) scale(0.985);
        }

        47% {
          filter: brightness(1.75) drop-shadow(0 0 26px #75f4fff2);
          transform: translateY(-2px) rotate(var(--cheer-victory-tilt))
            scale(1.035);
        }

        64% {
          filter: brightness(1.24) drop-shadow(0 0 15px #2fbfffbd);
          transform: rotate(var(--cheer-victory-counter-tilt)) scale(0.995);
        }

        82% {
          filter: brightness(1.62) drop-shadow(0 0 22px #68eaffdb);
          transform: translateY(-1px) rotate(var(--cheer-victory-tilt))
            scale(1.018);
        }

        100% {
          filter: brightness(1.18) drop-shadow(0 0 16px #2fc8ffb8);
          transform: rotate(0) scale(1);
        }
      }

      @keyframes cheer-victory-shimmer {
        0%,
        100% {
          filter: brightness(1.12) drop-shadow(0 0 14px #26b8ff9c);
          transform: translateY(0) rotate(0) scale(0.99);
        }

        50% {
          filter: brightness(1.5) drop-shadow(0 0 25px #64ecffe6);
          transform: translateY(-3px) rotate(var(--cheer-victory-tilt))
            scale(1.025);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .cheer-overlay-complete .cheer-stick-button {
          animation: none;
          filter: brightness(1.24) drop-shadow(0 0 18px #46d9ffc2);
          transform: none;
        }
      }

      .heart-letter-trace-stage:not(.is-started)
        .heart-letter-progress-path {
        opacity: 0;
      }

      .heart-letter-pink-heart {
        z-index: 3;
      }

      .heart-letter-pulse .heart-letter-pink-heart {
        animation: heart-letter-layer-transition 1.72s linear both;
      }

      @keyframes heart-letter-layer-transition {
        0%,
        62% {
          z-index: 5;
        }

        63%,
        100% {
          z-index: 3;
        }
      }

      .heart-letter-tucked-envelope {
        z-index: 6;
      }

      .heart-letter-delivered {
        width: max-content;
        margin-inline: auto;
        left: 0;
        right: 0;
        transform: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
