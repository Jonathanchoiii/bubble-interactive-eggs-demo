<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const forcedMode = params.get("native");
        const useNativePreview =
          forcedMode === "1" ||
          (forcedMode !== "0" &&
            window.matchMedia("(pointer: coarse)").matches &&
            window.innerWidth <= 600);
        document.documentElement.dataset.nativePreview = useNativePreview
          ? "true"
          : "false";
      })();
    </script>
    <title>Bubble 互动彩蛋原型</title>
    <script type="module" crossorigin src="/bubble-interactive-eggs-demo/assets/index-C-J-u_9U.js"></script>

  </head>

  </body>
</html>
